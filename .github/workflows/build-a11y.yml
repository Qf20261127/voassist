name: build-a11y-dylib

on:
  push:
    paths:
      - 'a11y/**'
      - '.github/workflows/build-a11y.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install ldid
        run: brew install ldid

      - name: Compile CallA11y.dylib (arm64 + arm64e)
        run: |
          set -e
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "SDK=$SDK"
          clang -arch arm64e -arch arm64 \
            -isysroot "$SDK" \
            -miphoneos-version-min=15.0 \
            -fobjc-arc -O2 -dynamiclib \
            -install_name @executable_path/CallA11y.dylib \
            -framework UIKit -framework Foundation \
            -o CallA11y.dylib a11y/Tweak.m
          ldid -S CallA11y.dylib
          lipo -info CallA11y.dylib
          otool -L CallA11y.dylib | head -20

      - uses: actions/upload-artifact@v4
        with:
          name: CallA11y-dylib
          path: CallA11y.dylib
          retention-days: 7
