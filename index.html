<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>打开闲鱼</title>
<style>
  :root { color-scheme: light dark; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
         font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif; background:#f7f7f7; }
  .card { width:min(86vw,360px); padding:28px 24px 22px; background:#fff; border-radius:18px;
          box-shadow:0 8px 30px rgba(0,0,0,.08); text-align:center; }
  .title { margin:0 0 6px; font-size:17px; font-weight:600; color:#222; }
  .id { margin:0 0 22px; font-size:13px; color:#888; word-break:break-all; }
  .btn { display:block; padding:15px; border-radius:12px; background:#ffd21e; color:#3d2b00;
         font-size:17px; font-weight:600; text-decoration:none; }
  .btn:active { opacity:.75; }
  .tip { margin:16px 0 0; font-size:12px; line-height:1.6; color:#999; }
  @media (prefers-color-scheme: dark) {
    body { background:#000; } .card { background:#1c1c1e; } .title { color:#f2f2f2; }
    .id { color:#8e8e93; } .tip { color:#8e8e93; }
  }
</style>
</head>
<body>
<div class="card">
  <p class="title">闲鱼商品</p>
  <p class="id" id="itemId">缺少商品 ID</p>
  <a class="btn" id="openBtn" href="#">打开闲鱼</a>
  <p class="tip">点了没反应的话，先打开一次闲鱼 App 再回来点这个按钮。</p>
</div>
<script>
  var id = new URLSearchParams(location.search).get('id') || '';
  if (id) {
    document.getElementById('itemId').textContent = '商品 ID：' + id;
    document.getElementById('openBtn').setAttribute('href', 'fleamarket://item?id=' + encodeURIComponent(id));
  } else {
    document.getElementById('openBtn').setAttribute('href', 'javascript:void(0)');
  }
</script>
</body>
</html>
